services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas?sslmode=disable
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SESSION_TTL: ${SESSION_TTL:-168h}
      HAJIMI_BASE_URL: ${HAJIMI_BASE_URL:-}
      HAJIMI_SSO_CLIENT_SECRET: ${HAJIMI_SSO_CLIENT_SECRET:-}
      HAJIMI_LOGIN_URL: ${HAJIMI_LOGIN_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    volumes:
      - canvas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  canvas_postgres_data:
