services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas?sslmode=disable
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      SESSION_TTL: ${SESSION_TTL:-168h}
      HAJIMI_BASE_URL: ${HAJIMI_BASE_URL:-}
      HAJIMI_SSO_CLIENT_SECRET: ${HAJIMI_SSO_CLIENT_SECRET:-}
      HAJIMI_LOGIN_URL: ${HAJIMI_LOGIN_URL:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-local-development-encryption-key}
      FILE_STORAGE_PATH: /var/lib/canvas/files
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - canvas_files_local:/var/lib/canvas/files

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    volumes:
      - canvas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  canvas_postgres_data:
  canvas_files_local:
